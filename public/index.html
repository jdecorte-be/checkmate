<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>checkmate.rb</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/board.css">
  <style>
    :root {
      --board-size: 560px;
    }
    @media (max-width: 620px) {
      :root { --board-size: 92vw; }
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: #1c1c1c;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 span {
      color: #888;
      font-weight: 400;
    }

    #status {
      min-height: 1.4em;
      font-size: 1rem;
      color: #ccc;
    }

    #status.check {
      color: #ff6b6b;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }

    button, select {
      font: inherit;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
    }

    button:hover, select:hover {
      background: #333;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .play-area {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .ai-debug {
      flex: 0 0 240px;
      width: 240px;
      max-height: var(--board-size);
      margin: 0;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #161616;
      color: #9fd39f;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    .ai-debug.placeholder {
      color: #666;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .play-area {
        flex-direction: column;
        align-items: center;
      }

      .ai-debug {
        width: var(--board-size);
        max-height: none;
      }
    }

    .multiplayer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .multiplayer[hidden] {
      display: none;
    }

    .multiplayer input {
      font: inherit;
      width: 6em;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
    }

    #room-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }

    #room-info[hidden] {
      display: none;
    }

    #room-code-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: #eee;
      padding: 2px 8px;
      border: 1px dashed #555;
      border-radius: 4px;
    }

    .note {
      max-width: var(--board-size);
      margin-top: 4px;
      padding-top: 16px;
      border-top: 1px solid #2a2a2a;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      color: #666;
      text-align: center;
    }

    .note a {
      color: #999;
      text-decoration: none;
      border-bottom: 1px solid #444;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .note a:hover,
    .note a:focus-visible {
      color: #eee;
      border-color: #999;
    }
  </style>
</head>
<body>
  <h1>checkmate.rb <span>— chess vs AI</span></h1>
  <div id="status">Loading...</div>

  <div class="play-area">
    <div id="board"></div>
    <pre id="ai-debug" class="ai-debug" hidden></pre>
  </div>

  <div class="controls">
    <button id="new-game">New game</button>
    <button id="flip">Flip board</button>
    <label>
      AI strength:
      <select id="difficulty"></select>
    </label>
    <label>
      Pieces:
      <select id="piece-set"></select>
    </label>
    <label>
      <input type="checkbox" id="debug-mode">
      Debug mode
    </label>
  </div>

  <div class="multiplayer" id="multiplayer-setup">
    <button id="create-room">Play a friend</button>
    <input id="join-code" placeholder="Code" maxlength="5" autocapitalize="characters">
    <button id="join-room">Join with code</button>
  </div>

  <div class="multiplayer" id="room-info" hidden>
    <span>Code: <span id="room-code-display"></span></span>
    <button id="copy-code" type="button">Copy</button>
    <span id="room-status-text"></span>
    <button id="leave-room" type="button">Leave</button>
  </div>

  <p class="note">
    Made by <a href="https://github.com/jdecorte-be" target="_blank" rel="noopener">jdecorte</a>,
    <a href="https://github.com/jdecorte-be/checkmate" target="_blank" rel="noopener">source code</a>.
  </p>

  <script type="module">
    import ChessBoard, { fenToPosition } from '/js/board.js';

    const PIECE_SETS = [
      'alpha', 'anarcandy', 'caliente', 'california', 'cardinal', 'cburnett',
      'celtic', 'chess7', 'chessnut', 'companion', 'cooke', 'disguised',
      'dubrovny', 'fantasy', 'firi', 'fresca', 'gioco', 'governor', 'horsey',
      'icpieces', 'kiwen-suwi', 'kosal', 'leipzig', 'letter', 'maestro',
      'merida', 'monarchy', 'mpchess', 'pirouetti', 'pixel', 'reillycraig',
      'rhosgfx', 'riohacha', 'shapes', 'spatial', 'staunty', 'tatiana', 'xkcd',
    ];

    const statusEl = document.getElementById('status');
    const debugModeEl = document.getElementById('debug-mode');
    const aiDebugEl = document.getElementById('ai-debug');
    let legalMovesBySquare = {};

    // -- 1v1-with-a-friend mode -------------------------------------------
    // `mode` is 'solo' (vs AI, the default) or 'room' (sharing a 5-character
    // code with a friend). Room state lives on the server; the client just
    // polls for the opponent's moves since there's no websocket.
    let mode = 'solo';
    let roomCode = null;
    let roomColor = null;
    let roomVersion = 0;
    let roomActive = false;
    let pollTimer = null;

    const multiplayerSetupEl = document.getElementById('multiplayer-setup');
    const roomInfoEl = document.getElementById('room-info');
    const roomCodeDisplayEl = document.getElementById('room-code-display');
    const roomStatusTextEl = document.getElementById('room-status-text');
    const joinCodeInput = document.getElementById('join-code');

    function setRoomStatusText(text) {
      roomStatusTextEl.textContent = text;
    }

    function showRoomPanel(code) {
      roomCodeDisplayEl.textContent = code;
      multiplayerSetupEl.hidden = true;
      roomInfoEl.hidden = false;
    }

    function hideRoomPanel() {
      multiplayerSetupEl.hidden = false;
      roomInfoEl.hidden = true;
      joinCodeInput.value = '';
    }

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(pollRoom, 1200);
    }

    function showAiDebugPlaceholder() {
      aiDebugEl.textContent = 'Debug mode on — analysis will appear after the AI\'s next move.';
      aiDebugEl.classList.add('placeholder');
      aiDebugEl.hidden = false;
    }

    function renderAiDebug(debug) {
      if (!debug) {
        aiDebugEl.hidden = true;
        aiDebugEl.textContent = '';
        aiDebugEl.classList.remove('placeholder');
        return;
      }
      const lines = [
        `AI ~${debug.elo} elo · depth ${debug.depth} · ${debug.nodes} nodes · ${debug.elapsedMs}ms`,
      ];
      if (debug.blunder) {
        lines.push('(blunder — played a random legal move instead of searching)');
      } else {
        debug.candidates.forEach((candidate, i) => {
          const pawns = candidate.score / 100;
          const sign = pawns >= 0 ? '+' : '';
          const marker = i === 0 ? '▶' : ' ';
          lines.push(`${marker} ${candidate.move.padEnd(6)} ${sign}${pawns.toFixed(2)}`);
        });
      }
      aiDebugEl.classList.remove('placeholder');
      aiDebugEl.textContent = lines.join('\n');
      aiDebugEl.hidden = false;
    }

    debugModeEl.addEventListener('change', () => {
      if (debugModeEl.checked) {
        showAiDebugPlaceholder();
      } else {
        renderAiDebug(null);
      }
    });

    function setStatus({ turn, check, checkmate, stalemate }) {
      const turnLabel = turn === 'white' ? 'White' : 'Black';
      const winner = turn === 'white' ? 'Black' : 'White';
      if (checkmate) {
        statusEl.textContent = `Checkmate — ${winner} wins`;
      } else if (stalemate) {
        statusEl.textContent = 'Stalemate — draw';
      } else if (check) {
        statusEl.textContent = `${turnLabel} to move — check!`;
      } else {
        statusEl.textContent = `${turnLabel} to move`;
      }
      statusEl.classList.toggle('check', !!check || !!checkmate);
    }

    async function refreshLegalMoves() {
      const url = roomActive ? `/api/rooms/${roomCode}/legal_moves` : '/api/legal_moves';
      const res = await fetch(url);
      legalMovesBySquare = await res.json();
    }

    const board = new ChessBoard(document.getElementById('board'), {
      pieceSet: 'cburnett',
      getDests: square => legalMovesBySquare[square] || [],
      onMove: ({ from, to }) => sendMove(from, to),
    });

    async function applyMoveResult(data) {
      board.move(data.lastMove.from, data.lastMove.to, {
        capture: data.capture,
        secondary: data.secondary,
        promotion: data.promotion,
      });
      board.setCheck(data.check);
      setStatus(data);
      if (data.aiDebug) renderAiDebug(data.aiDebug);
      await refreshLegalMoves();
      if (roomActive) {
        board.setViewOnly(data.turn !== roomColor || !!data.checkmate || !!data.stalemate);
      } else if (data.turn === 'black' && !data.checkmate && !data.stalemate) {
        await playAiMove();
      }
    }

    async function sendMove(from, to) {
      const url = roomActive ? `/api/rooms/${roomCode}/move` : '/api/move';
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from, to }),
      });
      if (!res.ok) return; // illegal - board already snapped back to `from`
      const data = await res.json();
      if (roomActive) roomVersion = data.version;
      await applyMoveResult(data);
    }

    async function playAiMove() {
      board.setViewOnly(true);
      statusEl.textContent = 'AI is thinking…';
      try {
        const url = debugModeEl.checked ? '/api/ai_move?debug=1' : '/api/ai_move';
        const res = await fetch(url, { method: 'POST' });
        if (res.ok) await applyMoveResult(await res.json());
      } finally {
        board.setViewOnly(false);
      }
    }

    async function enterActiveRoom(data) {
      mode = 'room';
      roomActive = true;
      roomColor = data.color;
      roomVersion = data.version || 0;
      board.setOrientation(roomColor);
      board.setPosition(fenToPosition(data.fen));
      board.setLastMove(null, null);
      board.setCheck(data.check);
      setStatus(data);
      setRoomStatusText(`Playing as ${roomColor === 'white' ? 'White' : 'Black'}`);
      await refreshLegalMoves();
      board.setViewOnly(data.turn !== roomColor || !!data.checkmate || !!data.stalemate);
    }

    async function pollRoom() {
      if (!roomCode) return;
      const res = await fetch(`/api/rooms/${roomCode}`);
      if (!res.ok) return;
      const data = await res.json();

      if (!roomActive) {
        if (data.status === 'active') await enterActiveRoom(data);
        return;
      }

      if (data.version > roomVersion) {
        roomVersion = data.version;
        if (data.move) await applyMoveResult(data.move);
      }
    }

    async function createRoom() {
      const res = await fetch('/api/rooms', { method: 'POST' });
      if (!res.ok) return;
      const data = await res.json();
      mode = 'room';
      roomActive = false;
      roomCode = data.code;
      roomColor = data.color;
      roomVersion = data.version || 0;
      showRoomPanel(data.code);
      setRoomStatusText('Waiting for your friend to join…');
      board.setOrientation('white');
      board.setPosition(fenToPosition(data.fen));
      board.setLastMove(null, null);
      board.setViewOnly(true);
      startPolling();
    }

    async function joinRoom(code) {
      const res = await fetch('/api/rooms/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok) {
        setRoomStatusText(data.error || 'Could not join that game.');
        return;
      }
      roomCode = data.code;
      showRoomPanel(data.code);
      await enterActiveRoom(data);
      startPolling();
    }

    function resetToSolo() {
      stopPolling();
      mode = 'solo';
      roomActive = false;
      roomCode = null;
      roomColor = null;
      roomVersion = 0;
      hideRoomPanel();
      board.setViewOnly(false);
      board.setOrientation('white');
    }

    function leaveRoom() {
      resetToSolo();
      loadGame();
    }

    async function loadGame() {
      const res = await fetch('/api/game');
      const data = await res.json();
      board.setPosition(fenToPosition(data.fen));
      board.setCheck(data.check);
      setStatus(data);
      await refreshLegalMoves();
      if (data.turn === 'black' && !data.checkmate && !data.stalemate) {
        await playAiMove();
      }
    }

    async function newGame() {
      if (mode === 'room') resetToSolo();
      const res = await fetch('/api/new_game', { method: 'POST' });
      const data = await res.json();
      board.setPosition(fenToPosition(data.fen));
      board.setLastMove(null, null);
      board.setCheck(data.check);
      setStatus(data);
      if (debugModeEl.checked) {
        showAiDebugPlaceholder();
      } else {
        renderAiDebug(null);
      }
      await refreshLegalMoves();
    }

    async function loadDifficulty() {
      const res = await fetch('/api/difficulty');
      const { levels, elo } = await res.json();
      const select = document.getElementById('difficulty');
      levels.forEach(lvl => {
        const opt = document.createElement('option');
        opt.value = lvl;
        opt.textContent = `~${lvl} Elo`;
        select.appendChild(opt);
      });
      select.value = elo;
      select.addEventListener('change', () => {
        fetch('/api/difficulty', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ elo: Number(select.value) }),
        });
      });
    }

    loadGame();
    loadDifficulty();

    document.getElementById('new-game').addEventListener('click', newGame);
    document.getElementById('flip').addEventListener('click', () => board.flip());

    document.getElementById('create-room').addEventListener('click', createRoom);
    document.getElementById('leave-room').addEventListener('click', leaveRoom);
    document.getElementById('join-room').addEventListener('click', () => {
      const code = joinCodeInput.value.trim();
      if (code) joinRoom(code);
    });
    joinCodeInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('join-room').click();
    });
    document.getElementById('copy-code').addEventListener('click', async () => {
      const copyBtn = document.getElementById('copy-code');
      try {
        await navigator.clipboard.writeText(roomCode || '');
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = original; }, 1200);
      } catch {
        // Clipboard access can be denied; the code is already visible on screen.
      }
    });

    const select = document.getElementById('piece-set');
    PIECE_SETS.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
    select.value = board.pieceSet;
    select.addEventListener('change', () => board.setPieceSet(select.value));
  </script>
</body>
</html>
